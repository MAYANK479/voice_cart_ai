<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="orb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad)" rx="16"/>
  <circle cx="600" cy="150" r="280" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="400" r="220" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Top Header Mockup -->
  <rect x="40" y="30" width="1120" height="65" rx="16" fill="url(#card-glass)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="60" y="44" width="36" height="36" rx="10" fill="url(#orb-grad)"/>
  <circle cx="78" cy="62" r="8" fill="#ffffff"/>
  
  <text x="110" y="60" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18">VoiceCart AI</text>
  <text x="110" y="74" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" letter-spacing="1">SMART SHOPPING ASSISTANT</text>
  
  <!-- Header Badges -->
  <rect x="760" y="47" width="110" height="30" rx="8" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.3)"/>
  <text x="815" y="67" fill="#fbbf24" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">✨ Smart AI Picks</text>

  <rect x="885" y="47" width="105" height="30" rx="8" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)"/>
  <text x="937" y="67" fill="#06b6d4" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">🛍️ Catalog (38)</text>

  <rect x="1005" y="47" width="135" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="1072" y="67" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">🇺🇸 English (US) ▾</text>

  <!-- Hero Voice Assistant Card -->
  <rect x="40" y="115" width="1120" height="190" rx="20" fill="url(#card-glass)" stroke="rgba(99,102,241,0.25)"/>
  
  <!-- Pulsing Soundwave Rings -->
  <circle cx="600" cy="180" r="55" fill="none" stroke="rgba(99,102,241,0.25)" stroke-width="2"/>
  <circle cx="600" cy="180" r="45" fill="none" stroke="rgba(99,102,241,0.4)" stroke-width="2"/>
  <circle cx="600" cy="180" r="35" fill="url(#orb-grad)" filter="url(#glow)"/>
  <path d="M596 172 A4 4 0 0 0 604 172 V184 A4 4 0 0 0 596 184 Z" fill="#ffffff"/>
  <path d="M592 178 A8 8 0 0 0 608 178" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Live Transcript Badge & Bubble -->
  <rect x="525" y="228" width="150" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)"/>
  <text x="600" y="243" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">● VOICE ENGINE ACTIVE</text>

  <rect x="340" y="258" width="520" height="34" rx="10" fill="rgba(10,16,30,0.85)" stroke="rgba(99,102,241,0.4)"/>
  <text x="600" y="280" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">Heard: "Add 2 bottles of organic milk and 1 dozen eggs"</text>

  <!-- Main Split Layout -->
  <!-- Left Column: Categorized Shopping List -->
  <rect x="40" y="325" width="760" height="325" rx="18" fill="url(#card-glass)" stroke="rgba(255,255,255,0.08)"/>
  
  <text x="65" y="360" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">🛒 My Smart Shopping List</text>
  <rect x="270" y="345" width="65" height="22" rx="11" fill="rgba(99,102,241,0.2)"/>
  <text x="302" y="360" fill="#a5b4fc" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">5 items</text>

  <!-- Category 1: Produce -->
  <rect x="65" y="380" width="710" height="68" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="80" y="405" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="13">🥑 Produce &amp; Fruits</text>
  <text x="80" y="432" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Organic Honeycrisp Apples</text>
  <text x="300" y="432" fill="#64748b" font-family="sans-serif" font-size="12">$3.99 / lb • 3 lbs</text>
  <rect x="420" y="418" width="60" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
  <text x="450" y="431" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Organic</text>
  <text x="735" y="432" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">$11.97</text>

  <!-- Category 2: Dairy & Eggs -->
  <rect x="65" y="460" width="710" height="68" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="80" y="485" fill="#3b82f6" font-family="sans-serif" font-weight="700" font-size="13">🥛 Dairy &amp; Eggs</text>
  <text x="80" y="512" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Pasture-Raised Grade A Large Eggs</text>
  <text x="345" y="512" fill="#64748b" font-family="sans-serif" font-size="12">$4.99 / carton • 1 carton</text>
  <text x="735" y="512" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">$4.99</text>

  <!-- Category 3: Bakery -->
  <rect x="65" y="540" width="710" height="68" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="80" y="565" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="13">🍞 Bakery &amp; Bread</text>
  <text x="80" y="592" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-decoration="line-through">Artisan Sourdough Loaf</text>
  <text x="270" y="592" fill="#64748b" font-family="sans-serif" font-size="12">$4.29 • Completed ✓</text>
  <text x="735" y="592" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">$4.29</text>

  <!-- Right Column: Sidebar (Budget & Restock) -->
  <!-- Budget Widget -->
  <rect x="820" y="325" width="340" height="150" rx="18" fill="url(#card-glass)" stroke="rgba(255,255,255,0.08)"/>
  <text x="845" y="358" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">ESTIMATED BUDGET</text>
  <text x="845" y="395" fill="#ffffff" font-family="monospace" font-size="28" font-weight="800">$21.25</text>
  <text x="1135" y="395" fill="#64748b" font-family="sans-serif" font-size="13" text-anchor="end">Target: $60.00</text>
  
  <rect x="845" y="415" width="290" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="845" y="415" width="105" height="8" rx="4" fill="url(#orb-grad)"/>
  <text x="845" y="445" fill="#94a3b8" font-family="sans-serif" font-size="12">35% of budget</text>
  <text x="1135" y="445" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">$38.75 left</text>

  <!-- Restock Widget -->
  <rect x="820" y="490" width="340" height="160" rx="18" fill="url(#card-glass)" stroke="rgba(255,255,255,0.08)"/>
  <text x="845" y="520" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">⏳ Running Low? (AI Predictions)</text>

  <rect x="845" y="535" width="290" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="858" y="555" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Organic Whole Milk</text>
  <text x="858" y="570" fill="#fbbf24" font-family="sans-serif" font-size="10">Last bought 6 days ago (Cycle: 4d)</text>
  <rect x="1065" y="546" width="60" height="26" rx="6" fill="rgba(99,102,241,0.25)" stroke="rgba(99,102,241,0.5)"/>
  <text x="1095" y="563" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ $4.49</text>

  <rect x="845" y="590" width="290" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="858" y="610" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">100% Whole Wheat Bread</text>
  <text x="858" y="625" fill="#fbbf24" font-family="sans-serif" font-size="10">Running low on bread loaf</text>
  <rect x="1065" y="601" width="60" height="26" rx="6" fill="rgba(99,102,241,0.25)" stroke="rgba(99,102,241,0.5)"/>
  <text x="1095" y="618" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ $4.49</text>
</svg>
