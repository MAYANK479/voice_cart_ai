<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg2)" rx="16"/>

  <!-- Card 1: Multilingual Voice & NLP -->
  <rect x="40" y="40" width="260" height="400" rx="16" fill="url(#card1)" stroke="rgba(99,102,241,0.3)"/>
  <circle cx="85" cy="85" r="25" fill="rgba(99,102,241,0.2)"/>
  <text x="85" y="93" font-size="22" text-anchor="middle">🎙️</text>
  <text x="65" y="145" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Voice &amp; NLP Engine</text>
  <text x="65" y="175" fill="#94a3b8" font-family="sans-serif" font-size="13" width="210">
    <tspan x="65" dy="0">• Web Speech API Continuous</tspan>
    <tspan x="65" dy="24">• Multilingual (EN, ES, FR, DE, HI)</tspan>
    <tspan x="65" dy="24">• Multi-item phrase chaining</tspan>
    <tspan x="65" dy="24">• 2-Way Text-to-Speech audio</tspan>
    <tspan x="65" dy="24">• Real-time waveform visualizer</tspan>
  </text>
  <rect x="65" y="380" width="130" height="30" rx="15" fill="rgba(99,102,241,0.2)"/>
  <text x="130" y="400" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SpeechRecognition</text>

  <!-- Card 2: Restock Intelligence -->
  <rect x="325" y="40" width="260" height="400" rx="16" fill="url(#card1)" stroke="rgba(251,191,36,0.3)"/>
  <circle cx="370" cy="85" r="25" fill="rgba(251,191,36,0.2)"/>
  <text x="370" y="93" font-size="22" text-anchor="middle">⏳</text>
  <text x="350" y="145" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Restock Predictor</text>
  <text x="350" y="175" fill="#94a3b8" font-family="sans-serif" font-size="13">
    <tspan x="350" dy="0">• Consumption velocity tracking</tspan>
    <tspan x="350" dy="24">• Historical purchase cycle AI</tspan>
    <tspan x="350" dy="24">• Running low proactive alerts</tspan>
    <tspan x="350" dy="24">• High / Med / Low urgency</tspan>
    <tspan x="350" dy="24">• 1-Click instant restock add</tspan>
  </text>
  <rect x="350" y="380" width="130" height="30" rx="15" fill="rgba(251,191,36,0.2)"/>
  <text x="415" y="400" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Predictive Engine</text>

  <!-- Card 3: Smart Substitutes & Deals -->
  <rect x="610" y="40" width="260" height="400" rx="16" fill="url(#card1)" stroke="rgba(16,185,129,0.3)"/>
  <circle cx="655" cy="85" r="25" fill="rgba(16,185,129,0.2)"/>
  <text x="655" y="93" font-size="22" text-anchor="middle">🥑</text>
  <text x="635" y="145" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Substitutes &amp; Deals</text>
  <text x="635" y="175" fill="#94a3b8" font-family="sans-serif" font-size="13">
    <tspan x="635" dy="0">• Dietary &amp; Vegan swaps</tspan>
    <tspan x="635" dy="24">• Seasonal peak harvest picks</tspan>
    <tspan x="635" dy="24">• Allergen &amp; gluten-free alternatives</tspan>
    <tspan x="635" dy="24">• Companion meal pairings</tspan>
    <tspan x="635" dy="24">• Flash sale discount radar</tspan>
  </text>
  <rect x="635" y="380" width="130" height="30" rx="15" fill="rgba(16,185,129,0.2)"/>
  <text x="700" y="400" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI Smart Finder</text>

  <!-- Card 4: Auto-Categorization & Budget -->
  <rect x="895" y="40" width="260" height="400" rx="16" fill="url(#card1)" stroke="rgba(6,182,212,0.3)"/>
  <circle cx="940" cy="85" r="25" fill="rgba(6,182,212,0.2)"/>
  <text x="940" y="93" font-size="22" text-anchor="middle">📊</text>
  <text x="920" y="145" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">8-Dept Organization</text>
  <text x="920" y="175" fill="#94a3b8" font-family="sans-serif" font-size="13">
    <tspan x="920" dy="0">• 8 Grocery departments</tspan>
    <tspan x="920" dy="24">• Live budget progress bar</tspan>
    <tspan x="920" dy="24">• Over-budget limit warnings</tspan>
    <tspan x="920" dy="24">• Confetti completion animation</tspan>
    <tspan x="920" dy="24">• CSV &amp; JSON list export</tspan>
  </text>
  <rect x="920" y="380" width="130" height="30" rx="15" fill="rgba(6,182,212,0.2)"/>
  <text x="985" y="400" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Organization &amp; Export</text>
</svg>
